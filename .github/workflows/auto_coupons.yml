name: Auto Fetch Coupons

on:
  schedule:
    - cron: '0 */6 * * *' # يعمل تلقائياً كل 6 ساعات
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت بضغطة زر

jobs:
  update-coupons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run coupon fetcher script
        env:
          ADMITAD_API_KEY: ${{ secrets.ADMITAD_API_KEY }}
          LINKARABY_API_KEY: ${{ secrets.LINKARABY_API_KEY }}
          TASK_API_KEY: ${{ secrets.TASK_API_KEY }}
        run: |
          python scripts/fetch_coupons.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-update coupons and affiliate links [skip ci]"
          branch: main

